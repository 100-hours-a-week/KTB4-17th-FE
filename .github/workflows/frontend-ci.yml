# 기존: name: frontend CI
name: Frontend CI

on:
  push:
    branches:
      - "chore/**"

  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  feature_ci:
    name: Feature CI
    runs-on: ubuntu-latest


    steps:
      - name: Check source
        # 기존: uses: actions/checkout@v6
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        # 기존: uses: actions/setup-node@v6
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # 기존:
      # - name: Lint
      #   run: npx @biomejs/biome lint . && npx htmlhint "**/*.html" && npx stylelint "**/*.css"
      #
      # - name: Formatter Check
      #   run: npx @biomejs/biome format .
      - name: Biome Check
        # 기존 : run: npm exec --offline -- biome ci .
        run: npm run lint:biome

      - name: HTML Lint
        # 기존 : run: npm exec --offline -- htmlhint "**/*.html"
        run: npm run lint:html

      - name: CSS Lint
        # 기존 : run: npm exec --offline -- stylelint "**/*.css"
        run: npm run lint:css

      - name: Type Check
        run: npm run typecheck

      - name: Dependency Vulnerability Check
        run: npm audit --audit-level=high


      - name: Build
        # 기존: run: npm run build --if-present
        run: npm run build
