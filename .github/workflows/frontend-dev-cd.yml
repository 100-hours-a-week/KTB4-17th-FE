name: Frontend DEV CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: frontend-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
  S3_PREFIX: dev
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  FRONTEND_BUILD_DIR: ${{ vars.FRONTEND_BUILD_DIR || 'dist' }}

jobs:
  deploy:
    name: Deploy Frontend to DEV S3
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend Build
        env:
          VITE_DEMO_MODE: 'true' # 피드백 카드 더미 데이터 (src/features/sentence-cards/dummyCards.js)
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npm run build

      # This role trusts the dev branch OIDC subject, without an environment subject.
      - name: AWS OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV_S3 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload DEV assets to S3
        run: |
          set -euo pipefail
          test -f "$FRONTEND_BUILD_DIR/index.html"
          # Retain old assets so open browser sessions can finish loading them.
          aws s3 sync "$FRONTEND_BUILD_DIR/" "s3://$S3_BUCKET/$S3_PREFIX/" \
            --exclude 'index.html'
          # Publish the entry point after every referenced asset is available.
          aws s3 cp "$FRONTEND_BUILD_DIR/index.html" "s3://$S3_BUCKET/$S3_PREFIX/index.html" \
            --cache-control 'no-cache'

      - name: Invalidate DEV CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/$S3_PREFIX/*"
