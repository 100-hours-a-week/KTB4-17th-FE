name: Frontend CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency: # 배포가 동시에 실행되지 않도록 순서대로 처리
  group: frontend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  FRONTEND_BUILD_DIR: ${{ vars.FRONTEND_BUILD_DIR || 'dist' }}

jobs:
  frontend_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check source
        uses: actions/checkout@v7
        # checkout은 코드를 가져오는 action이며 비밀번호 탐지 기능은 제공하지 않습니다.
        with:
          persist-credentials: false

      - name: Setup Node.js # JavaScript 빌드에 필요
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: AWS OIDC Authentication # GitHub Actions에서 AWS로 접근할 때 인증
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Frontend Build
        run: |
          npm ci
          npm run build

      # CI 검사는 frontend-ci.yml에서 실행합니다.
      # - name: Biome Check
      #   run: npm run lint:biome
      # - name: HTML Lint
      #   run: npm run lint:html
      # - name: CSS Lint
      #   run: npm run lint:css
      # - name: Type Check
      #   run: npm run typecheck
      # - name: Test
      #   run: npm test
      # - name: Dependency Vulnerability Check
      #   run: npm audit --audit-level=high

      - name: Upload to S3 # --delete: 빌드 결과에 없는 이전 파일은 버킷에서 삭제
        run: aws s3 sync "$FRONTEND_BUILD_DIR" "s3://$S3_BUCKET" --delete

      - name: index.html no-cache # 브라우저가 항상 최신 index.html을 받도록 설정
        run: |
          aws s3 cp "$FRONTEND_BUILD_DIR/index.html" "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"

      - name: CloudFront Cache # 변경 파일을 새로 가져오도록 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
